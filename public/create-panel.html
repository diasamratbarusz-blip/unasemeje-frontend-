<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance | PanelEngine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    .gear-spin-slow { animation: spin 12s linear infinite; }
    .gear-spin-reverse { animation: spin-reverse 8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased selection:bg-blue-600 selection:text-white">

  <!-- Main Container -->
  <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-8 text-center shadow-2xl backdrop-blur relative overflow-hidden">
    
    <!-- Background Glow Effect -->
    <div class="absolute -top-12 -left-12 w-40 h-40 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-12 -right-12 w-40 h-40 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Animated Maintenance Gear Icon -->
    <div class="relative w-24 h-24 mx-auto mb-6 flex items-center justify-center">
      <i class="fa-solid fa-gear text-6xl text-slate-800 gear-spin-slow absolute"></i>
      <i class="fa-solid fa-gear text-4xl text-blue-500 gear-spin-reverse absolute top-2 right-2"></i>
      <i class="fa-solid fa-wrench text-2xl text-slate-200 absolute"></i>
    </div>

    <!-- Status Badge -->
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-semibold mb-4">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
      Scheduled Maintenance
    </div>

    <!-- Heading & Description -->
    <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight mb-3">We'll Be Back Soon</h1>
    <p class="text-slate-400 text-sm leading-relaxed mb-6">
      This page is currently undergoing scheduled system updates and maintenance to improve performance and stability.
    </p>

    <!-- Info Box -->
    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-4 text-xs text-slate-300 space-y-2 mb-6 text-left">
      <div class="flex justify-between items-center border-b border-slate-800/60 pb-2">
        <span class="text-slate-500 font-medium">Status:</span>
        <span class="text-amber-400 font-semibold font-mono">Upgrading System</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-slate-500 font-medium">Estimated Completion:</span>
        <span class="text-slate-200 font-mono">~30–60 Minutes</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-3">
      <button onclick="window.location.reload()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition-all text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
        <i class="fa-solid fa-rotate-right text-xs"></i> Check Status Again
      </button>

      <a href="https://wa.me/254715509440" target="_blank" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 rounded-xl transition-all text-xs flex items-center justify-center gap-2 border border-slate-700/60 block">
        <i class="fab fa-whatsapp text-emerald-400 text-sm"></i> Contact WhatsApp Support
      </a>
    </div>

    <!-- Footer Tag -->
    <div class="mt-8 pt-6 border-t border-slate-800/80 text-[11px] text-slate-500">
      PanelEngine Platform Infrastructure
    </div>
  </div>

</body>
</html>
