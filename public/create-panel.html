<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance | PanelEngine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    .pulse-ring { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-blue-600 selection:text-white">

  <!-- Background Decorative Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"></div>
  </div>

  <div class="max-w-lg w-full bg-slate-900/80 border border-slate-800/80 rounded-3xl p-8 sm:p-10 shadow-2xl backdrop-blur-xl relative z-10 text-center">
    
    <!-- Maintenance Icon Indicator -->
    <div class="relative w-24 h-24 mx-auto mb-6 flex items-center justify-center">
      <div class="absolute inset-0 bg-blue-500/10 border border-blue-500/20 rounded-full pulse-ring"></div>
      <div class="w-16 h-16 bg-blue-600/20 border border-blue-500/30 rounded-2xl flex items-center justify-center text-blue-400 text-3xl shadow-lg shadow-blue-500/10">
        <i class="fa-solid fa-wrench"></i>
      </div>
    </div>

    <!-- Main Message -->
    <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-semibold mb-4">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Scheduled System Upgrade
    </div>
    
    <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight mb-3">We'll Be Right Back</h1>
    <p class="text-slate-400 text-sm leading-relaxed mb-8">
      We are currently performing routine system updates to improve performance and stability. Services will resume shortly.
    </p>

    <!-- Progress / Estimated Time Card -->
    <div class="bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4 mb-8 text-left space-y-3">
      <div class="flex justify-between items-center text-xs">
        <span class="text-slate-400 font-medium">Estimated Downtime:</span>
        <span class="text-blue-400 font-mono font-bold"><i class="fa-regular fa-clock mr-1"></i> ~ 45 Minutes</span>
      </div>
      
      <!-- Animated Progress Bar -->
      <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-500 h-full rounded-full w-2/3 animate-pulse"></div>
      </div>

      <div class="flex justify-between items-center text-[11px] text-slate-500 font-mono">
        <span>Status: Database Migration</span>
        <span>65%</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-3">
      <button onclick="window.location.reload()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-xl transition-all text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
        <i class="fa-solid fa-rotate-right"></i> Check Status & Refresh
      </button>
      
      <a href="https://wa.me/254715509440" target="_blank" class="w-full bg-slate-800/80 hover:bg-slate-800 text-slate-300 hover:text-white font-medium py-3 px-6 rounded-xl border border-slate-700/60 transition-all text-sm flex items-center justify-center gap-2">
        <i class="fab fa-whatsapp text-emerald-400"></i> Contact Urgent Support
      </a>
    </div>

    <!-- Footer -->
    <div class="mt-8 pt-6 border-t border-slate-800/60 text-xs text-slate-500 flex items-center justify-between">
      <span class="font-extrabold text-slate-400 tracking-tight">Panel<span class="text-blue-500">Engine</span></span>
      <span>Thank you for your patience</span>
    </div>

  </div>

</body>
</html>
